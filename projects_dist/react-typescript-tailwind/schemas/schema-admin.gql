"""This directive allows results to be deferred during execution"""
directive @defer on FIELD

"""
Tells the service this field/object has access authorized by sigv4 signing.
"""
directive @aws_iam on OBJECT | FIELD_DEFINITION

"""
Tells the service this field/object has access authorized by an API key.
"""
directive @aws_api_key on OBJECT | FIELD_DEFINITION

"""
Tells the service this field/object has access authorized by an OIDC token.
"""
directive @aws_oidc on OBJECT | FIELD_DEFINITION

"""Directs the schema to enforce authorization on a field"""
directive @aws_auth(
  """List of cognito user pool groups which have access on this field"""
  cognito_groups: [String]
) on FIELD_DEFINITION

"""
Tells the service which subscriptions will be published to when this mutation is called. This directive is deprecated use @aws_susbscribe directive instead.
"""
directive @aws_publish(
  """
  List of subscriptions which will be published to when this mutation is called.
  """
  subscriptions: [String]
) on FIELD_DEFINITION

"""Tells the service which mutation triggers this subscription."""
directive @aws_subscribe(
  """
  List of mutations which will trigger this subscription when they are called.
  """
  mutations: [String]
) on FIELD_DEFINITION

"""
Tells the service this field/object has access authorized by a Lambda Authorizer.
"""
directive @aws_lambda on OBJECT | FIELD_DEFINITION

"""
Tells the service this field/object has access authorized by a Cognito User Pools token.
"""
directive @aws_cognito_user_pools(
  """List of cognito user pool groups which have access on this field"""
  cognito_groups: [String]
) on OBJECT | FIELD_DEFINITION

type Query {
  listUsers(count: Int, nextToken: String): UserList
  listTenants(count: Int, nextToken: String): TenantList
  getTenant(tenant: String): Tenant
  listUserGroups(count: Int, nextToken: String): UserGroupList
  getPermission(group: String): Permission
  getUserData(sub: String): UserProfile
  listPermission(count: Int, nextToken: String): PermissionList
}

type UserList {
  users: [UserProfile]
  nextToken: String
}

type UserProfile {
  groups: [String]
  sub: String
  email: String
  tenant: String
  userPoolId: String
  name: String
  surname: String
  updatedAt: AWSDateTime
  state: String
  createdAt: AWSDateTime
  timeZone: String
  jobTitle: String
}

"""
The `AWSDateTime` scalar type provided by AWS AppSync, represents a valid ***extended*** [ISO 8601 DateTime](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) string. In other words, this scalar type accepts datetime strings of the form `YYYY-MM-DDThh:mm:ss.SSSZ`.  The scalar can also accept "negative years" of the form `-YYYY` which correspond to years before `0000`. For example, "**-2017-01-01T00:00Z**" and "**-9999-01-01T00:00Z**" are both valid datetime strings.  The field after the two digit seconds field is a nanoseconds field. It can accept between 1 and 9 digits. So, for example, "**1970-01-01T12:00:00.2Z**", "**1970-01-01T12:00:00.277Z**" and "**1970-01-01T12:00:00.123456789Z**" are all valid datetime strings.  The seconds and nanoseconds fields are optional (the seconds field must be specified if the nanoseconds field is to be used).  The [time zone offset](https://en.wikipedia.org/wiki/ISO_8601#Time_zone_designators) is compulsory for this scalar. The time zone offset must either be `Z` (representing the UTC time zone) or be in the format `±hh:mm:ss`. The seconds field in the timezone offset will be considered valid even though it is not part of the ISO 8601 standard.
"""
scalar AWSDateTime

type TenantList {
  tenants: [Tenant]
  nextToken: String
}

type Tenant {
  tenant: String
  domain: String
  tenantName: String
  userPoolId: String
  createdAt: AWSDateTime
  state: String
  adminEmail: String
  orgCode: String
  timeZone: String
  jobTitle: String
}

type UserGroupList {
  groups: [UserGroup]
  nextToken: String
}

type UserGroup {
  group: String
  name: String
  description: String
}

type Permission {
  tenant: String
  group: String
  permission: [String]
}

type PermissionList {
  permissions: [Permission]
}

type Mutation {
  addTenant(timeZone: String, jobTitle: String, tenantName: String, name: String, surname: String, domain: String!, orgCode: String!, adminEmail: AWSEmail, sendActivationEmailToAdmin: Boolean): Tenant
  addDefaultGroups(tenant: String): String
  addDefaultUserGroup(name: String, description: String): UserGroup
  addSuperUGroup(name: String, description: String): UserGroup
  addUser(timeZone: String, jobTitle: String, email: AWSEmail, groups: [String], name: String, surname: String): addUserOutput
  updateUserProfile(email: AWSEmail, name: String!, surname: String!, isFederation: Boolean): UserProfile
  deleteUserGroup(group: String): DeleteUserGroup
  deleteSuperUUser(email: AWSEmail, sub: String, tenant: String): DeleteUser
  deleteTenant(tenant: String): DeleteTenant
  deleteSuperUGroup(group: String): DeleteTenantGroup
  updatePermission(group: String, permission: [String]): Permission
}

"""
The `AWSEmail` scalar type provided by AWS AppSync, represents an Email address string that complies with [RFC 822](https://www.ietf.org/rfc/rfc822.txt). For example, "**username@example.com**" is a valid Email address.
"""
scalar AWSEmail

type addUserOutput {
  tenant: String
  createdAt: AWSDateTime
  email: String
  name: String
  groupsList: [String]
  surname: String
  sub: String
  timeZone: String
  jobTitle: String
}

type DeleteUserGroup {
  tenant: String
  group: String
}

type DeleteUser {
  tenant: String
  sub: String
  email: String
}

type DeleteTenant {
  tenant: String
  removeTenantToDynamo: Boolean
  removeTenantToCognito: Boolean
  removeTenantGroups: Boolean
  removeTenantUsersGroups: Boolean
  removeTenantUsers: Boolean
  removeS3Data: Boolean
}

type DeleteTenantGroup {
  tenant: String
  group: String
  tenantGroupDelete: String
  tenantUsersGroupDelete: String
}

type User {
  tenant: String
  createdAt: AWSDateTime
  email: String
}